name: Live model

# Never a merge gate. The model legitimately changes its tool choice between
# releases, and a blocking live test makes the repository unmergeable on a day
# nothing was shipped. It runs nightly and opens an issue instead.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

jobs:
  ai-live:
    name: Golden questions against the real model
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner != '' }}
    services:
      kafka:
        image: apache/kafka:4.3.1
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
          CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Run the live suite
        run: uv run pytest -m ai_live --tb=short | tee live.log
        env:
          LEDGER_KAFKA_BOOTSTRAP: localhost:9092
          LEDGER_MODEL: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Summarise
        if: always()
        run: |
          {
            echo "## Live model run"
            echo '```'
            tail -40 live.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
