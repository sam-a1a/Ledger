server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Required because the upstream below is a variable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Resolved per request rather than at config load.
        #
        # `proxy_pass http://api:8000` resolves once, at startup, and nginx
        # refuses to start at all if the name does not resolve yet -- so the web
        # container could not boot before the API existed, and cached its
        # address afterwards, surviving neither a restart nor a rescheduled
        # container. Going through a variable defers resolution to request time.
        #
        # With a variable, nginx no longer forwards the original URI
        # automatically, hence the explicit $request_uri.
        set $ledger_api http://api:8000;
        proxy_pass $ledger_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Without these the SSE response is buffered and the whole answer
        # arrives at once. This is the "streaming works locally but not in
        # Docker" bug, and it is invisible until you deploy behind a proxy.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}
